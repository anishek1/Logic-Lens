services:
  - type: web
    name: logic-lens-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: model-cache
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: FASTEMBED_CACHE_DIR
        value: /data/fastembed_cache
      - key: REPOS_DIR
        value: /data/cloned_repos
      - key: ENABLE_RAG
        value: "true"
      - key: ENABLE_RERANK
        value: "true"
